    <script type="text/javascript">
      // Detección de conexiones lentas con timeout para evitar bloqueo
      (function() {
        var connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
        var timeout = setTimeout(function() {
          document.documentElement.classList.add('default-connection');
        }, 50);
        
        if (connection) {
          clearTimeout(timeout);
          if (connection.effectiveType === '2g' || connection.effectiveType === 'slow-2g' || connection.saveData) {
            document.documentElement.classList.add('slow-connection');
          }
        }
      })();
    </script>

    <!-- Carga diferida y optimizada de recursos externos -->
    <script>
      // Estrategia de carga diferida para recursos no críticos
      document.addEventListener('DOMContentLoaded', function() {
        // Observador de intersección para cargar fuentes cuando estén en viewport
        var fontObserver = new IntersectionObserver(function(entries) {
          if (entries[0].isIntersecting) {
            // Cargar fuentes solo cuando se necesiten
            var fontLink = document.createElement('link');
            fontLink.rel = 'stylesheet';
            fontLink.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap';
            fontLink.media = 'print';
            fontLink.onload = function() {
              fontLink.media = 'all';
            };
            document.head.appendChild(fontLink);
            
            // Desconectar el observador una vez cargado
            fontObserver.disconnect();
          }
        }, {
          rootMargin: '0px 0px 200px 0px',
          threshold: 0.01
        });
        
        // Observar el cuerpo del documento
        fontObserver.observe(document.body);
        
        // Detección de idle time para cargar scripts no críticos
        if ('requestIdleCallback' in window) {
          requestIdleCallback(function() {
            if (!navigator.onLine) return;
            
            // Cargar sitemap generador solo en producción
            if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
              setTimeout(function() {
                var sitemapScript = document.createElement('script');
                sitemapScript.src = '/js/generate-sitemap.js';
                sitemapScript.async = true;
                document.body.appendChild(sitemapScript);
              }, 5000);
            }
          }, { timeout: 5000 });
        }
      });
    </script>
